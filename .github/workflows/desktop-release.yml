name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

env:
  DESKTOP_PROJ: SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj
  CORE_PROJ: SpooderInstallerSharp/SpooderInstallerSharp.csproj
  PUBLISH_DIR: publish
  ASSET_NAME: SpooderInstallerSharp.Desktop.exe

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    # Cache NuGet packages
    - name: Cache NuGet
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore ${{ env.DESKTOP_PROJ }}

    - name: Build Core
      run: dotnet build ${{ env.CORE_PROJ }} --configuration Release --no-restore

    - name: Build Desktop
      run: dotnet build ${{ env.DESKTOP_PROJ }} --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.DESKTOP_PROJ }} --configuration Release --no-restore --output ${{ env.PUBLISH_DIR }}

    - name: List publish output
      shell: pwsh
      run: Get-ChildItem -Recurse -Path ${{ env.PUBLISH_DIR }}

    # Upload build artifacts (helpful for debugging or reusing in other jobs)
    - name: Upload Published Binaries
      uses: actions/upload-artifact@v4
      with:
        name: desktop-binaries
        path: ${{ env.PUBLISH_DIR }}

    - name: Get Tag Name
      id: get_tag
      shell: pwsh
      run: |
        $tagName = ""
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
        }
        elseif ("${{ github.event.inputs.tag_name }}" -ne "") {
          $tagName = "${{ github.event.inputs.tag_name }}"
        }
        else {
          $tagName = "untagged-build-${{ github.sha }}"
        }
        $tagName = $tagName.Trim()
        if ([string]::IsNullOrEmpty($tagName)) {
          Write-Error "Tag name is empty!"
          exit 1
        }
        echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
        Write-Host "Using TAG_NAME: $tagName"

    - name: Create or Update Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $currentTag = "${{ steps.get_tag.outputs.TAG_NAME }}"
        $assetPath = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_DIR }}/${{ env.ASSET_NAME }}"
        Write-Host "Processing release for tag: $currentTag"
        Write-Host "Asset path: $assetPath"

        if (-not (Test-Path $assetPath)) {
          Write-Error "Asset not found at $assetPath"
          exit 1
        }

        # Check if release exists
        gh release view "$currentTag" --repo "$env:GITHUB_REPOSITORY" *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release exists; uploading asset."
          gh release upload "$currentTag" "$assetPath" --clobber --repo "$env:GITHUB_REPOSITORY"
          gh release edit "$currentTag" --title "Release $currentTag" --repo "$env:GITHUB_REPOSITORY"
        } else {
          Write-Host "Creating new release."
          gh release create "$currentTag" "$assetPath" `
            --title "Release $currentTag" `
            --notes "Automated release for $currentTag" `
            --repo "$env:GITHUB_REPOSITORY"
        }
