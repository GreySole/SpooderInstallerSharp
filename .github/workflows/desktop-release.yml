name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

env:
  DESKTOP_PROJ: SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj
  CORE_PROJ: SpooderInstallerSharp/SpooderInstallerSharp.csproj
  PUBLISH_DIR: publish
  ASSET_EXE: SpooderInstallerSharp.Desktop.exe   # Name of produced single-file exe
  RUNTIME: win-x64
  SELF_CONTAINED: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    # Cache NuGet packages
    - name: Cache NuGet
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    # Install Velopack CLI
    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Restore dependencies
      run: dotnet restore ${{ env.DESKTOP_PROJ }}

    - name: Build Core
      run: dotnet build ${{ env.CORE_PROJ }} --configuration Release --no-restore

    - name: Build Desktop
      run: dotnet build ${{ env.DESKTOP_PROJ }} --configuration Release --no-restore

    # Publish single-file, self-contained, win-x64; include native libs for self-extract
    - name: Publish
      run: >
        dotnet publish ${{ env.DESKTOP_PROJ }}
        --configuration Release
        --no-restore
        --runtime ${{ env.RUNTIME }}
        --self-contained ${{ env.SELF_CONTAINED }}
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        --output ${{ env.PUBLISH_DIR }}

    - name: List publish output
      shell: pwsh
      run: Get-ChildItem -Recurse -Path ${{ env.PUBLISH_DIR }}

    - name: Get Tag Name and Version
      id: get_tag
      shell: pwsh
      run: |
        $tagName = ""
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
        }
        elseif ("${{ github.event.inputs.tag_name }}" -ne "") {
          $tagName = "${{ github.event.inputs.tag_name }}"
        }
        else {
          $tagName = "untagged-build-${{ github.sha }}"
        }
        $tagName = $tagName.Trim()
        if ([string]::IsNullOrEmpty($tagName)) {
          Write-Error "Tag name is empty!"
          exit 1
        }
        
        # Extract version number from tag (remove 'v' prefix if present)
        $version = $tagName
        if ($version.StartsWith('v')) {
          $version = $version.Substring(1)
        }
        
        echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Using TAG_NAME: $tagName"
        Write-Host "Using VERSION: $version"

    # Create Velopack installer
    - name: Create Velopack Installer
      shell: pwsh
      run: |
        $publishDir = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_DIR }}"
        $version = "${{ steps.get_tag.outputs.VERSION }}"
        
        Write-Host "Creating Velopack installer..."
        Write-Host "Publish directory: $publishDir"
        Write-Host "Version: $version"
        
        # Ensure we're in the right directory for relative paths
        Set-Location $env:GITHUB_WORKSPACE
        
        vpk pack -u Spooder_Manager --packTitle "Spooder Manager" --icon .\SpooderInstallerSharp\Assets\favicon.ico --splashImage .\SpooderInstallerSharp\Assets\spooder-loading.gif -v $version -p $publishDir -e SpooderInstallerSharp.Desktop.exe
        
        Write-Host "Velopack packaging completed"

    # Upload full publish directory (diagnostics / downstream)
    - name: Upload Published Binaries
      uses: actions/upload-artifact@v4
      with:
        name: desktop-binaries
        path: ${{ env.PUBLISH_DIR }}

    # Upload Velopack installer files
    - name: Upload Velopack Installer
      uses: actions/upload-artifact@v4
      with:
        name: velopack-installer
        path: Releases

    # Package exe + nodejs folder into versioned zip (keeping original functionality)
    - name: Package Release Zip
      id: package
      shell: pwsh
      run: |
        $publishDir = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_DIR }}"
        $exePath     = Join-Path $publishDir "${{ env.ASSET_EXE }}"
        $nodeDir     = Join-Path $publishDir "nodejs"

        if (-not (Test-Path $exePath)) {
          Write-Error "Expected EXE not found: $exePath"
          exit 1
        }
        $nodeExe = Join-Path $nodeDir "node.exe"
        if (-not (Test-Path $nodeExe)) {
          Write-Error "Expected node.exe not found in: $nodeExe. Check project publish copy."
          Get-ChildItem -Recurse -Path $publishDir
          exit 1
        }
        if (-not (Test-Path $nodeDir)) {
          Write-Error "nodejs folder missing at $nodeDir"
          exit 1
        }

        $tagName = "${{ steps.get_tag.outputs.TAG_NAME }}"
        # e.g., SpooderInstallerSharp.Desktop-v1.2.3-win-x64.zip
        $zipName = "SpooderInstallerSharp.Desktop-$tagName-${{ env.RUNTIME }}.zip"
        $zipPath = Join-Path $publishDir $zipName

        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        # Compress both the exe and entire nodejs folder
        Compress-Archive -Path $exePath, $nodeDir -DestinationPath $zipPath -Force

        Write-Host "Created package: $zipPath"
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        echo "ZIP_PATH=$zipPath" >> $env:GITHUB_OUTPUT

    - name: Create or Update Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $currentTag = "${{ steps.get_tag.outputs.TAG_NAME }}"
        $zipPath    = "${{ steps.package.outputs.ZIP_PATH }}"
        $zipName    = "${{ steps.package.outputs.ZIP_NAME }}"
        
        Write-Host "Processing release for tag: $currentTag"
        Write-Host "Asset path: $zipPath"

        if (-not (Test-Path $zipPath)) {
          Write-Error "Release asset zip not found at $zipPath"
          exit 1
        }

        # Find Velopack installer files
        $releasesDir = Join-Path $env:GITHUB_WORKSPACE "Releases"
        $installerFiles = @()
        if (Test-Path $releasesDir) {
          $installerFiles = Get-ChildItem -Path $releasesDir -File | ForEach-Object { $_.FullName }
          Write-Host "Found Velopack installer files:"
          $installerFiles | ForEach-Object { Write-Host "  $_" }
        }

        # Check if release exists
        gh release view "$currentTag" --repo "$env:GITHUB_REPOSITORY" *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release exists; uploading assets."
          gh release upload "$currentTag" "$zipPath" --clobber --repo "$env:GITHUB_REPOSITORY"
          
          # Upload Velopack installer files
          foreach ($file in $installerFiles) {
            gh release upload "$currentTag" "$file" --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          
          gh release edit "$currentTag" --title "Release $currentTag" --repo "$env:GITHUB_REPOSITORY"
        } else {
          Write-Host "Creating new release."
          $assets = @($zipPath) + $installerFiles
          gh release create "$currentTag" $assets `
            --title "Release $currentTag" `
            --notes "Automated release for $currentTag`n`nIncludes:`n- Portable ZIP package`n- Velopack installer for automatic updates" `
            --repo "$env:GITHUB_REPOSITORY"
        }
