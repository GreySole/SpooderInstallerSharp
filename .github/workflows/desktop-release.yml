name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev' # A dummy default for manual runs
      
permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj

    - name: Build Core
      run: dotnet build SpooderInstallerSharp/SpooderInstallerSharp.csproj --configuration Release --no-restore

    - name: Build Desktop
      run: dotnet build SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore --output publish

    - name: Get Tag Name
      id: get_tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Check for existing release and Create/Update
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Pass the token to gh CLI
        TAG: ${{ steps.get_tag.outputs.TAG_NAME }} # Use the extracted tag name
        ASSET_PATH: publish/SpooderInstallerSharp.Desktop.exe # Define your asset path
        ASSET_NAME: SpooderInstallerSharp.Desktop.exe # Define your desired asset name
      run: |
        # Check if a release for this tag already exists
        # `gh release view` returns exit code 0 if found, non-zero if not found
        gh release view "$TAG" > /dev/null 2>&1

        # Check the exit code of the previous command
        if [ $? -eq 0 ]; then # Correct Bash 'if' syntax: 'if [ condition ]; then'
          echo "Release for tag $TAG already exists. Updating it."
          # Upload asset, clobbering (replacing) if it already exists
          gh release upload "$TAG" "$ASSET_PATH" --clobber --repo "$GITHUB_REPOSITORY"

          # Edit the release details (title, draft, prerelease status)
          gh release edit "$TAG" \
            --title "Release $TAG" \
            --prerelease=false \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
        else
          echo "No release for tag $TAG found. Creating a new one."
          # Create a new release with the asset
          gh release create "$TAG" \
            --title "Release $TAG" \
            --prerelease=false \
            --draft=false \
            --notes "Automated release for $TAG" \
            "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY"
        fi # Correct Bash 'if' syntax: 'fi' to close the if statement
