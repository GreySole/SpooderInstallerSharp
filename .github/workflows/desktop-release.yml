name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
      
permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj

    - name: Build Core
      run: dotnet build SpooderInstallerSharp/SpooderInstallerSharp.csproj --configuration Release --no-restore

    - name: Build Desktop
      run: dotnet build SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore --output publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app
        path: publish

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1 # <--- New action
      if: startsWith(github.ref, 'refs/tags/') # Only run if triggered by a tag
      with:
        tag_name: ${{ github.ref }} # The tag that triggered the workflow
        name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        # This is the key part: it will update if the release already exists
        # if you set `replaces-assets: true`, it will replace existing assets
        # for the same name.
        files: |
          publish/SpooderInstallerSharp.Desktop.exe # Your executable path
        # You can add a body if you want release notes
        # body: "New automated release of SpooderInstallerSharp.Desktop"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Still need the token
