name: Build and Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to build and release (e.g., v1.0.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  DESKTOP_PROJ: SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj
  CORE_PROJ: SpooderInstallerSharp/SpooderInstallerSharp.csproj
  PUBLISH_DIR: publish
  SELF_CONTAINED: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            asset_exe: SpooderInstallerSharp.Desktop.exe
            icon: favicon.ico
            channel_platform: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
            asset_exe: SpooderInstallerSharp.Desktop
            icon: favicon.png
            channel_platform: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
            asset_exe: SpooderInstallerSharp.Desktop
            icon: favicon.png
            channel_platform: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      # Cache NuGet packages
      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      # mksquashfs is required by vpk to build the AppImage; not preinstalled on ubuntu runners
      - name: Install Velopack Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      # Install Velopack CLI
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Get Tag Name and Version
        id: get_tag
        shell: pwsh
        run: |
          $tagName = ""
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
          }
          elseif ("${{ github.event.inputs.tag_name }}" -ne "") {
            $tagName = "${{ github.event.inputs.tag_name }}"
          }
          else {
            $tagName = "untagged-build-${{ github.sha }}"
          }
          $tagName = $tagName.Trim()
          if ([string]::IsNullOrEmpty($tagName)) {
            Write-Error "Tag name is empty!"
            exit 1
          }

          # Extract version number from tag (remove 'v' prefix if present)
          $version = $tagName
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          # For assembly versions, we need a clean version without pre-release suffixes for AssemblyVersion
          # but keep the full version for FileVersion
          $assemblyVersion = $version -replace "-.*$", ""
          $fileVersion = $version

          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_OUTPUT
          echo "FILE_VERSION=$fileVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Using TAG_NAME: $tagName"
          Write-Host "Using VERSION: $version"
          Write-Host "Using ASSEMBLY_VERSION: $assemblyVersion"
          Write-Host "Using FILE_VERSION: $fileVersion"

      - name: Restore dependencies
        run: dotnet restore ${{ env.DESKTOP_PROJ }}

      - name: Build Core
        run: >
          dotnet build ${{ env.CORE_PROJ }}
          --configuration Release
          --no-restore
          -p:AssemblyVersion=${{ steps.get_tag.outputs.ASSEMBLY_VERSION }}
          -p:FileVersion=${{ steps.get_tag.outputs.FILE_VERSION }}
          -p:Version=${{ steps.get_tag.outputs.FILE_VERSION }}

      - name: Build Desktop
        run: >
          dotnet build ${{ env.DESKTOP_PROJ }}
          --configuration Release
          --no-restore
          -p:AssemblyVersion=${{ steps.get_tag.outputs.ASSEMBLY_VERSION }}
          -p:FileVersion=${{ steps.get_tag.outputs.FILE_VERSION }}
          -p:Version=${{ steps.get_tag.outputs.FILE_VERSION }}

      # Publish single-file, self-contained; include native libs for self-extract
      - name: Publish
        run: >
          dotnet publish ${{ env.DESKTOP_PROJ }}
          --configuration Release
          --no-restore
          --runtime ${{ matrix.runtime }}
          --self-contained ${{ env.SELF_CONTAINED }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:AssemblyVersion=${{ steps.get_tag.outputs.ASSEMBLY_VERSION }}
          -p:FileVersion=${{ steps.get_tag.outputs.FILE_VERSION }}
          -p:Version=${{ steps.get_tag.outputs.FILE_VERSION }}
          --output ${{ env.PUBLISH_DIR }}

      # dotnet publish doesn't preserve the execute bit on Linux; Velopack and end users both need it set
      - name: Mark published binary executable (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          chmod +x "${{ env.PUBLISH_DIR }}/${{ matrix.asset_exe }}"
          chmod +x "${{ env.PUBLISH_DIR }}/nodejs/bin/node"

      # Create Velopack installer (Setup.exe + Portable.zip on Windows, .AppImage on Linux)
      - name: Create Velopack Installer
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_DIR }}"
          $version = "${{ steps.get_tag.outputs.VERSION }}"
          $iconPath = Join-Path $env:GITHUB_WORKSPACE "SpooderInstallerSharp/Assets/${{ matrix.icon }}"

          Write-Host "Creating Velopack installer..."
          Write-Host "Publish directory: $publishDir"
          Write-Host "Version: $version"

          # Extract channel from version (e.g., "0.5.0-beta" -> "beta")
          $channel = "stable"  # default fallback
          if ($version -match "^[^-]+-(.+)$") {
              $channel = $matches[1]
          }

          # Combine platform and channel
          $channelArg = "${{ matrix.channel_platform }}-$channel"

          Write-Host "Detected channel: $channel"
          Write-Host "Platform: ${{ matrix.channel_platform }}"
          Write-Host "Channel argument: $channelArg"

          # Remove channel suffix from version for Velopack
          $cleanVersion = $version -replace "-.*$", ""
          Write-Host "Clean version: $cleanVersion"

          # Ensure we're in the right directory for relative paths
          Set-Location $env:GITHUB_WORKSPACE

          $releasesDir = Join-Path $env:GITHUB_WORKSPACE "Releases/${{ matrix.runtime }}"

          $vpkArgs = @(
            "pack", "-u", "Spooder_Manager", "--packTitle", "Spooder Manager",
            "--icon", $iconPath,
            "-v", $cleanVersion, "-p", $publishDir, "-e", "${{ matrix.asset_exe }}", "-c", $channelArg,
            "-o", $releasesDir
          )

          # splashImage is a Windows installer-only concept
          if ("${{ matrix.os }}" -eq "windows-latest") {
            $vpkArgs += @("--splashImage", (Join-Path $env:GITHUB_WORKSPACE "SpooderInstallerSharp/Assets/spooder-loading.gif"))
          }

          & vpk @vpkArgs

          Write-Host "Velopack packaging completed"

      # Upload full publish directory (diagnostics / downstream)
      - name: Upload Published Binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.runtime }}
          path: ${{ env.PUBLISH_DIR }}

      # Upload Velopack installer files
      - name: Upload Velopack Installer
        uses: actions/upload-artifact@v4
        with:
          name: velopack-installer-${{ matrix.runtime }}
          path: Releases/${{ matrix.runtime }}

      # Package exe + nodejs folder into versioned archive (Windows: zip, Linux: tar.gz to preserve executable permissions)
      - name: Package Release Archive
        id: package
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "${{ env.PUBLISH_DIR }}"
          $exePath     = Join-Path $publishDir "${{ matrix.asset_exe }}"
          $nodeDir     = Join-Path $publishDir "nodejs"

          if (-not (Test-Path $exePath)) {
            Write-Error "Expected executable not found: $exePath"
            exit 1
          }
          $nodeExeName = if ("${{ matrix.os }}" -eq "windows-latest") { "node.exe" } else { "bin/node" }
          $nodeExe = Join-Path $nodeDir $nodeExeName
          if (-not (Test-Path $nodeExe)) {
            Write-Error "Expected node executable not found in: $nodeExe. Check project publish copy."
            Get-ChildItem -Recurse -Path $publishDir
            exit 1
          }

          $tagName = "${{ steps.get_tag.outputs.TAG_NAME }}"

          if ("${{ matrix.os }}" -eq "windows-latest") {
            $archiveName = "SpooderInstallerSharp.Desktop-$tagName-${{ matrix.runtime }}.zip"
            $archivePath = Join-Path $publishDir $archiveName
            if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
            Compress-Archive -Path $exePath, $nodeDir -DestinationPath $archivePath -Force
          } else {
            $archiveName = "SpooderInstallerSharp.Desktop-$tagName-${{ matrix.runtime }}.tar.gz"
            $archivePath = Join-Path $publishDir $archiveName
            if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
            # tar (unlike Compress-Archive) preserves the execute bit, which Linux needs
            tar -czf $archivePath -C $publishDir "${{ matrix.asset_exe }}" "nodejs"
          }

          Write-Host "Created package: $archivePath"
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_PATH=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.runtime }}
          path: ${{ steps.package.outputs.ARCHIVE_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get Tag Name
        id: get_tag
        shell: pwsh
        run: |
          $tagName = ""
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
          }
          elseif ("${{ github.event.inputs.tag_name }}" -ne "") {
            $tagName = "${{ github.event.inputs.tag_name }}"
          }
          else {
            $tagName = "untagged-build-${{ github.sha }}"
          }
          echo "TAG_NAME=$($tagName.Trim())" >> $env:GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "release-archive-*"
          path: artifacts/archives
          merge-multiple: true

      - name: Download all Velopack installers
        uses: actions/download-artifact@v4
        with:
          pattern: "velopack-installer-*"
          path: artifacts/installers
          merge-multiple: true

      - name: Create or Update Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $currentTag = "${{ steps.get_tag.outputs.TAG_NAME }}"

          $assets = @()
          $assets += Get-ChildItem -Path "artifacts/archives" -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path "artifacts/installers" -File | ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            Write-Error "No release assets found to upload!"
            exit 1
          }

          Write-Host "Processing release for tag: $currentTag"
          Write-Host "Assets:"
          $assets | ForEach-Object { Write-Host "  $_" }

          # Check if release exists
          gh release view "$currentTag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release exists; uploading assets."
            foreach ($file in $assets) {
              gh release upload "$currentTag" "$file" --clobber --repo "$env:GITHUB_REPOSITORY"
            }
            gh release edit "$currentTag" --title "Release $currentTag" --repo "$env:GITHUB_REPOSITORY"
          } else {
            Write-Host "Creating new release."
            gh release create "$currentTag" $assets `
              --title "Release $currentTag" `
              --notes "Automated release for $currentTag`n`nIncludes:`n- Portable archives (Windows zip / Linux tar.gz)`n- Velopack installer for automatic updates (Windows Setup.exe / Linux AppImage)" `
              --repo "$env:GITHUB_REPOSITORY"
          }
