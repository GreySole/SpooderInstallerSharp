name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build and release (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev' # A dummy default for manual runs
      
permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj

    - name: Build Core
      run: dotnet build SpooderInstallerSharp/SpooderInstallerSharp.csproj --configuration Release --no-restore

    - name: Build Desktop
      run: dotnet build SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish SpooderInstallerSharp.Desktop/SpooderInstallerSharp.Desktop.csproj --configuration Release --no-restore --output publish

    - name: Get Tag Name
      id: get_tag
      shell: pwsh
      run: |
        Write-Host "Raw GITHUB_REF: '$env:GITHUB_REF'"

        $tagName = "" # Initialize $tagName
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
        }
        elseif ("${{ github.event.inputs.tag_name }}" -ne "") {
          $tagName = "${{ github.event.inputs.tag_name }}"
        }
        else {
          $tagName = "untagged-build-${{ github.sha }}"
          Write-Host "Warning: No tag found in GITHUB_REF or workflow_dispatch input. Using default: $tagName"
        }

        # --- Add more explicit trimming and validation here ---
        $tagName = $tagName.Trim() # Trim any whitespace
        if ([string]::IsNullOrEmpty($tagName)) {
          Write-Host "Error: Extracted tag name is empty after processing!"
          exit 1 # Fail fast if tag is genuinely empty
        }
        # ---------------------------------------------------

        Write-Host "Extracted TAG_NAME (after trim): '$tagName'"
        echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

    - name: Check for existing release and Create/Update
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ASSET_PATH: publish/SpooderInstallerSharp.Desktop.exe
        ASSET_NAME: SpooderInstallerSharp.Desktop.exe
      run: |
        # Use a local variable to be absolutely sure
        $currentTag = "${{ steps.get_tag.outputs.TAG_NAME }}"

        Write-Host "Processing tag: '$currentTag'" # Verify again here
        Write-Host "Length of tag: $($currentTag.Length)" # Check if it's really empty

        if ([string]::IsNullOrEmpty($currentTag)) {
          Write-Host "Error: \$currentTag is empty inside the release step. Exiting."
          exit 1 # Fail if the variable is somehow empty
        }

        # Check if a release for this tag already exists
        # Use $currentTag directly
        gh release view "$currentTag" > $null 2>&1

        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release for tag $currentTag already exists. Updating it."
          gh release upload "$currentTag" "$ASSET_PATH" --clobber --repo "$env:GITHUB_REPOSITORY"
          gh release edit "$currentTag" `
            --title "Release $currentTag" `
            --prerelease=$false `
            --draft=$false `
            --repo "$env:GITHUB_REPOSITORY"
        } else {
          Write-Host "No release for tag $currentTag found. Creating a new one."
          gh release create "$currentTag" `
            --title "Release $currentTag" `
            --prerelease=$false `
            --draft=$false `
            --notes "Automated release for $currentTag" `
            "$ASSET_PATH" `
            --repo "$env:GITHUB_REPOSITORY"
        }
      shell: pwsh
